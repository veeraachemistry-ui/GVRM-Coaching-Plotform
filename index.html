<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G.V.R.M.Solutions Online Coaching Platform</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#667085;--ac:#9b1c31;--gold:#d4a017;--bd:#e3e6ee;--ok:#2f9e44;--no:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--tx:#eceff5;--mu:#98a2b3;--ac:#f0676f;--gold:#f2c14e;--bd:#2c3140;--ok:#51cf66;--no:#ff6b6b}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--tx:#eceff5;--mu:#98a2b3;--ac:#f0676f;--gold:#f2c14e;--bd:#2c3140;--ok:#51cf66;--no:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:16px;background:radial-gradient(circle at 20% 0,#b3243a,#5c0f1c 70%);color:#fff;border-bottom:3px solid var(--gold)}.lg{width:84px;height:84px;border-radius:50%;flex:none;filter:drop-shadow(0 0 10px rgba(255,215,0,.6));animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px) rotate(3deg)}}@media (prefers-reduced-motion:reduce){.lg{animation:none}}header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffe27a,#ffb300,#fff2b0);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{font-weight:700;font-size:15px}.tag{font-size:12px;color:#ffd966}header small{opacity:.8;font-size:12px}.strip{height:5px;background:linear-gradient(90deg,#c0392b,#f39c12,#f1c40f,#2f9e44,#c0392b)}.card{box-shadow:inset 0 4px 0 var(--k,var(--gold))}.card:nth-child(4n+2){--k:#c0392b}.card:nth-child(4n+3){--k:#2f9e44}.card:nth-child(4n+4){--k:#f39c12}nav button.on{background:linear-gradient(135deg,#9b1c31,#c0392b);box-shadow:0 2px 6px rgba(155,28,49,.4)}h2{color:var(--ac)}
nav{display:flex;gap:4px;padding:8px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mu);padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.s{background:none;color:var(--no);padding:4px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.p{color:var(--ok)}.a{color:var(--no)}
a{color:var(--ac)}
.hide{display:none}

let db=null,edit=false,tab="dash",S=[],N=[],C=[],A=[],T=[],F=[],role=null,meId=null,ce=false,invId="",lm="",lerr="",nc="",TT=[],HW=[],MQ=[],SW=[],UID=null,par=false,NT=[],CF={},nn="",fl=0,lk=0,subj="",selT="",month=new Date().toISOString().slice(0,7),date=new Date().toISOString().slice(0,10),me="";

const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function put(col,id,data){try{await db.collection(col).doc(id).set(data)}catch(e){alert("Save panna mudiyala: "+(e.message||e.code))}}
async function del(col,id){if(!confirm("Delete pannava?"))return;try{if(col==="notes"){const f=(N.find(x=>x.id===id)||{}).file;if(f&&window.claude&&claude.files)claude.files.del(f.id).catch(()=>{})}await db.collection(col).doc(id).delete()}catch(e){alert(e.message)}}
function sub(col,fn){try{db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));render()},()=>{})}catch(e){}}
function nav(){$("#nav").innerHTML=TABS.filter(([k])=>role==="student"?(k!=="students"&&k!=="dash"&&k!=="settings"):((k!=="fees"&&k!=="settings")||edit)).map(([k,l])=>`<button class="${k===tab?"on":""}" style="--tc:${TC[k]||"#9b1c31"}" onclick="tab='${k}';nav();render()">${IC[k]||""} ${tr(l)}</button>`).join("")}
function pct(id){const d=A.length;if(!d)return"–";const p=A.filter(x=>x.present&&x.present[id]).length;return Math.round(p*100/d)+"%"}
function render(){
 if(role&&CF.until&&!active()){role=null;meId=null;edit=false;sv();lerr="Subscription mudinjiduchu."}const m=$("#main");$("#lo").classList.toggle("hide",!role);$("#who").textContent=role==="teacher"?"Teacher / Admin mode":role==="student"?(par?"Parent of ":"Student: ")+((S.find(x=>x.id===meId)||{}).name||""):"Please login";$("#nav").style.display=role?"":"none";document.querySelector("header").style.display=role?"":"none";document.querySelector(".strip").style.display=role?"":"none";if(db&&!role){m.innerHTML=loginUI();drawQR();return}if(db&&["dash","tests","fees","report","notice","settings","hw","tt","mcq","cert"].includes(tab)){m.innerHTML=ext();return}

 if(tab==="students")m.innerHTML=editUI()+(edit?`<div class="card"><h2>Student entry</h2><input id="sn" placeholder="Name"><input id="sp" placeholder="Student phone"><input id="pp" placeholder="Parent phone (WhatsApp)"><input id="sc" placeholder="Batch / Course"><button class="btn" onclick="addS()">Add student</button></div>`:"")+
  `<div class="card"><h2>Students (${S.length})</h2>${S.length?S.map(s=>`<div class="row"><div><b>${avt(s.name)}${esc(s.name)}</b><div class="mu">${esc(s.batch)} · ${esc(s.phone)}${s.parent?" · Parent: "+esc(s.parent):""}</div></div><div><span class="pill">${pct(s.id)} attendance</span>${edit?`<button class="btn s" style="color:var(--ac)" onclick="es='${s.id}';render();scrollTo(0,0)">✏</button><button class="btn s" onclick="del('students','${s.id}')">🗑</button>`:""}</div></div>`).join(""):'<div class="mu">Innum students illa.</div>'}</div>`;
 if(tab==="attendance"){
  const rec=A.find(x=>x.id===date)||{present:{}};
  m.innerHTML=`<div class="card"><h2>Attendance</h2><input type="date" value="${date}" onchange="date=this.value;render()">${V().length?V().map(s=>{const p=!!rec.present[s.id];return `<div class="row"><span>${avt(s.name)}${esc(s.name)} <span class="mu">${esc(s.batch)}</span></span>${edit?`<button class="btn" style="background:${p?"var(--ok)":"var(--no)"}" onclick="mark('${s.id}',${!p})">${p?"Present":"Absent"}</button>`:`<span class="pill ${p?"p":"a"}">${p?"Present":"Absent"}</span>`}</div>`}).join(""):'<div class="mu">First students add pannunga.</div>'}</div>`}
 if(tab==="notes")m.innerHTML=(edit?`<div class="card"><h2>Add notes</h2><input id="nt" placeholder="Title"><input id="ns" placeholder="Subject"><input id="nl" placeholder="Link (Drive / PDF / YouTube) - optional">${window.claude&&claude.files?`<label class="mu">📎 Computer-la irundhu file upload (PDF / Word / PPT / Image / Video, max 50MB)</label><input id="nf" type="file">`:""}<textarea id="nb" rows="3" placeholder="Notes / description"></textarea><button class="btn" onclick="addN()">Publish note</button></div>`:"")+
  `<div class="card"><h2>Study notes</h2><select onchange="subj=this.value;render()"><option value="">All subjects</option>${[...new Set(N.map(n=>n.subject).filter(Boolean))].map(s=>`<option ${s===subj?"selected":""}>${esc(s)}</option>`).join("")}</select>${N.length?N.filter(n=>!subj||n.subject===subj).sort((a,b)=>b.at-a.at).map(n=>`<div class="row"><div><b>${esc(n.title)}</b> <span class="pill">${esc(n.subject)}</span><div>${esc(n.body)}</div>${/^https?:\/\//.test(n.link)?`<a href="${esc(n.link)}" target="_blank" rel="noopener">Open material ↗</a>`:""}${n.file?`<div><button class="btn" style="padding:5px 10px;margin-top:4px" onclick="openN('${n.id}')">📎 ${esc(n.file.name)} (${Math.max(1,Math.round(n.file.size/1024))} KB)</button></div>`:""}</div>${edit?`<button class="btn s" onclick="del('notes','${n.id}')">✕</button>`:""}</div>`).join(""):'<div class="mu">Notes illa.</div>'}</div>`;
 if(tab==="live")m.innerHTML=notifyUI()+(edit?`<div class="card"><h2>Schedule live class</h2><input id="ct" placeholder="Topic"><input id="cd" type="datetime-local"><select id="cb"><option value="">All batches</option>${[...new Set(S.map(s=>s.batch).filter(Boolean))].map(b=>`<option>${esc(b)}</option>`).join("")}</select><input id="cl" placeholder="Meeting link (paste or generate)"><button class="btn" onclick="genLink()">⚡ Generate meeting link</button> <a class="btn" style="text-decoration:none" href="https://meet.google.com/new" target="_blank" rel="noopener">Google Meet</a><div class="mu" style="margin:6px 0">Google Meet-la new meeting create panni link-ah paste pannunga, illana Generate click pannunga.</div><button class="btn" onclick="addC()">Schedule</button></div>`:"")+
  `<div class="card"><h2>Live classes</h2>${C.length?C.sort((a,b)=>a.when.localeCompare(b.when)).map(c=>`<div class="row"><div><b>${esc(c.topic)}</b><div class="mu">${esc(c.when.replace("T"," "))}</div></div><div>${/^https?:\/\//.test(c.link)?`<a class="btn" style="text-decoration:none" href="${esc(c.link)}" target="_blank" rel="noopener">Join</a>`:""}${edit?`<button class="btn" onclick="nc='${c.id}';render()">📲 Notify</button><button class="btn s" onclick="del('classes','${c.id}')">✕</button>`:""}</div></div>`).join(""):'<div class="mu">Classes schedule aagala.</div>'}</div>`;

function testsUI(){
 const t=T.find(x=>x.id===selT);
 let h=edit?`<div class="card"><h2>New test</h2><input id="tn" placeholder="Test name"><input id="ts" placeholder="Subject"><input id="td" type="date" value="${date}"><input id="tm" type="number" placeholder="Max marks" value="100"><button class="btn" onclick="addT()">Create test</button></div>`:"";
 h+=`<div class="card"><h2>Tests</h2>${T.length?[...T].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><div><b>${esc(x.name)}</b> <span class="pill">${esc(x.subject)}</span><div class="mu">${x.date} · max ${x.max} · ${Object.keys(x.marks||{}).length} entered</div></div><div><button class="btn" onclick="selT='${x.id}';render()">${edit?"Marks":"View"}</button>${edit?`<button class="btn s" onclick="del('tests','${x.id}')">✕</button>`:""}</div></div>`).join(""):'<div class="mu">Tests illa.</div>'}</div>`;
 if(t)h+=marksUI(t);
 return h}
const nk=x=>(x||"").toLowerCase().split(" ").join("");
const grd=p=>p>=90?"A+":p>=80?"A":p>=70?"B+":p>=60?"B":p>=PM()?"C":"F";
function marksUI(t){const L=V(),pm=PM(),m=Object.values(t.marks||{}).filter(x=>isFinite(x));
 const st=m.length?`<div class="mu" style="margin-bottom:6px">Avg ${Math.round(m.reduce((a,b)=>a+b,0)/m.length*100/t.max)}% · High ${Math.max(...m)} · Low ${Math.min(...m)} · Pass ${m.filter(x=>x*100/t.max>=pm).length}/${m.length}</div>`:"";
 const rows=L.map(s=>{const v=(t.marks||{})[s.id],p=v==null?null:Math.round(v*100/t.max);return `<div class="row"><span>${avt(s.name)}${esc(s.name)} <span class="mu">${esc(s.batch)}</span></span><span style="display:flex;gap:8px;align-items:center">${edit?`<input class="mk" data-sid="${s.id}" type="number" min="0" max="${t.max}" step="0.5" style="width:80px;margin:0" value="${v??""}" onkeydown="if(event.key==='Enter'){event.preventDefault();const a=[...document.querySelectorAll('.mk')],i=a.indexOf(this);(a[i+1]||this).focus()}">`:`<b>${v??"-"}</b>`}<span class="pill ${p==null?"":p>=pm?"p":"a"}">${p==null?"-":p+"% · "+grd(p)}</span></span></div>`}).join("");
 const tools=edit?`<div style="margin:10px 0"><button class="btn" onclick="saveAll('${t.id}')">💾 Save all marks</button> <button class="btn" onclick="expM('${t.id}')">⬇ Export CSV</button> <button class="btn s" onclick="clrM('${t.id}')">🗑 Clear</button></div><div class="mu">Tip: mark type panni Enter thattunga, next student-ku pogum.</div><details style="margin-top:8px"><summary>📋 Paste from Excel / WhatsApp</summary><textarea id="mk_paste" rows="5" placeholder="Name, Marks (oru line-ku oru student)\nArun, 85\nPriya, 92"></textarea><button class="btn" onclick="pasteM('${t.id}')">Apply</button></details><details style="margin-top:6px"><summary>📁 Import CSV file (Excel → Save as CSV)</summary><input type="file" accept=".csv,.txt" onchange="impMarks('${t.id}',this.files[0])"></details>`:"";
 return `<div class="card"><h2>${esc(t.name)} – marks (/${t.max})</h2>${st}${rows||'<div class="mu">Students illa.</div>'}${tools}</div>`}
function saveAll(tid){const {id,...t}=T.find(x=>x.id===tid),marks={...(t.marks||{})};document.querySelectorAll(".mk").forEach(i=>{if(i.value===""||!isFinite(+i.value))delete marks[i.dataset.sid];else marks[i.dataset.sid]=Math.min(+i.value,t.max)});put("tests",tid,{...t,marks});alert("Marks saved ✅")}
function pairsFrom(x){return x.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[\t,;:|]+/).map(y=>y.trim()).filter(Boolean);return[p.slice(0,-1).join(" "),p[p.length-1]]})}
function applyM(tid,pairs){const {id,...t}=T.find(x=>x.id===tid),marks={...(t.marks||{})};let ok=0;const bad=[];pairs.forEach(([n,v])=>{const s=S.find(x=>nk(x.name)===nk(n));if(s&&isFinite(+v)){marks[s.id]=Math.min(+v,t.max);ok++}else bad.push(n||"?")});put("tests",tid,{...t,marks});alert(ok+" marks saved"+(bad.length?". Match aagala: "+bad.join(", "):""))}
function pasteM(tid){applyM(tid,pairsFrom($("#mk_paste").value))}
function impMarks(tid,f){if(!f)return;const r=new FileReader();r.onload=()=>applyM(tid,pairsFrom(String(r.result)).filter(x=>isFinite(+x[1])));r.readAsText(f)}
function clrM(tid){if(!confirm("Ella marks-um clear pannava?"))return;const {id,...t}=T.find(x=>x.id===tid);put("tests",tid,{...t,marks:{}})}
async function expM(tid){const t=T.find(x=>x.id===tid),q=x=>'"'+String(x).split('"').join('""')+'"',csv="Name,Batch,Marks,Max,Percent\n"+S.map(s=>{const v=(t.marks||{})[s.id];return[s.name,s.batch,v??"",t.max,v==null?"":Math.round(v*100/t.max)].map(q).join(",")}).join("\n");try{const d=await claude.use("downloads");await d.save({filename:t.name.split(" ").join("_")+"-marks.csv",data:"\ufeff"+csv})}catch(e){alert("Export aagala")}}
function addT(){const n=$("#tn").value.trim();if(!n)return;put("tests",uid(),{name:n,subject:$("#ts").value.trim()||"General",date:$("#td").value,max:+$("#tm").value||100,marks:{}})}
function setM(tid,sid,v){const {id,...t}=T.find(x=>x.id===tid);const marks={...(t.marks||{})};if(v==="")delete marks[sid];else marks[sid]=Math.min(+v,t.max);put("tests",tid,{...t,marks})}
function feesUI(){
 if(role==="student")return invoiceUI(meId);if(invId)return invoiceUI(invId);
 let due=0,got=0;
 const rows=S.map(s=>{const f=F.find(x=>x.id===s.id)||{};const amt=+f.monthly||0;const p=!!(f.paid||{})[month];p?got+=amt:due+=amt;
  return `<div class="row"><div><b>${avt(s.name)}${esc(s.name)}</b><div class="mu">₹<input type="number" style="width:90px;margin:0 0 0 4px;display:inline-block" value="${amt||""}" placeholder="Monthly" onchange="setFee('${s.id}',this.value)"></div></div><button class="btn" style="background:${p?"var(--ok)":"var(--no)"}" onclick="togFee('${s.id}')">${p?"Paid":"Due"}</button> <button class="btn" onclick="invId='${s.id}';render()">🧾 Invoice</button></div>`}).join("");
 return `<div class="card"><h2>Subscription fees</h2><input type="month" value="${month}" onchange="month=this.value;render()"><div class="row"><span>Collected</span><b class="p">₹${got}</b></div><div class="row"><span>Pending</span><b class="a">₹${due}</b></div></div><div class="card">${rows||'<div class="mu">Students add pannunga.</div>'}</div>`}
function setFee(id,v){const {id:_,...r}=F.find(x=>x.id===id)||{};put("fees",id,{...r,monthly:+v||0})}
function togFee(id){const f=F.find(x=>x.id===id)||{};const {id:_,...r}=f;put("fees",id,{...r,paid:{...(f.paid||{}),[month]:!(f.paid||{})[month]}})}
function avgPct(sid){const r=T.filter(t=>(t.marks||{})[sid]!=null).map(t=>t.marks[sid]*100/t.max);return r.length?Math.round(r.reduce((a,b)=>a+b,0)/r.length):null}
function reportUI(){
 const bar=v=>`<div style="background:var(--bd);border-radius:6px;height:8px;margin-top:4px"><div style="width:${v||0}%;height:8px;border-radius:6px;background:${v>=60?"var(--ok)":v>=40?"var(--ac)":"var(--no)"}"></div></div>`;
 const rank=V().map(s=>({s,v:avgPct(s.id)})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
 const subs={};T.forEach(t=>{const k=t.subject||"General";Object.values(t.marks||{}).forEach(m=>{(subs[k]=subs[k]||[]).push(m*100/t.max)})});
 const tr=T.map(t=>{const m=Object.values(t.marks||{});if(!m.length)return"";const avg=Math.round(m.reduce((a,b)=>a+b,0)/m.length*100/t.max);const ps=m.filter(x=>x*100/t.max>=PM()).length;return `<div class="row"><div><b>${esc(t.name)}</b><div class="mu">${esc(t.subject)} · High ${Math.max(...m)} · Low ${Math.min(...m)} · Pass ${ps}/${m.length}</div></div><b>${avg}%</b></div>`}).join("");
 const row=(l,v,x)=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${v}%</b></div>${bar(v)}${x||""}</div>`;
 return `<div class="card"><h2>Rank list (avg test %)</h2>${rank.length?rank.map((x,i)=>row(`${i+1}. ${esc(x.s.name)}`,x.v,`<div class="mu">Attendance ${pct(x.s.id)}${edit?` · Fee ${month}: ${((F.find(f=>f.id===x.s.id)||{}).paid||{})[month]?"Paid":"Due"}`:""}</div>`)).join(""):'<div class="mu">Marks enter pannunga.</div>'}</div><div class="card"><h2>Subject-wise average</h2>${Object.keys(subs).map(k=>row(esc(k),Math.round(subs[k].reduce((a,b)=>a+b,0)/subs[k].length))).join("")||'<div class="mu">Data illa.</div>'}</div><div class="card"><h2>Test-wise analysis</h2>${tr||'<div class="mu">Data illa.</div>'}</div><div class="card"><h2>Needs attention (below pass mark)</h2>${rank.filter(x=>x.v<PM()).map(x=>`<div class="row"><span>${esc(x.s.name)}</span><b class="a">${x.v}%</b></div>`).join("")||'<div class="mu">Yarum 40%-ku keela illa 👍</div>'}</div>`}
function addS(){const n=$("#sn").value.trim();if(!n)return;put("students",uid(),{name:n,phone:$("#sp").value,parent:$("#pp").value,batch:$("#sc").value});$("#sn").value=$("#sp").value=$("#pp").value=$("#sc").value=""}
function mark(id,v){const rec=A.find(x=>x.id===date)||{present:{}};const p={...rec.present,[id]:v};put("attendance",date,{present:p})}
async function openN(id){const f=(N.find(x=>x.id===id)||{}).file;if(!f)return;try{const u=await claude.files.url(f.id),a=document.createElement("a");a.href=u;a.target="_blank";if(!/^(application\/pdf|image\/|video\/|audio\/)/.test(f.type||""))a.download=f.name;document.body.appendChild(a);a.click();a.remove()}catch(e){alert("File kidaikala. Upload panna device/browser-la mattum irukkum.")}}
async function addN(){const t=$("#nt").value.trim();if(!t)return;const f=$("#nf")&&$("#nf").files[0];let fl=null;
 if(f){if(f.size>50*1048576)return alert("File 50MB-ku mela irukku. Chinna file use pannunga or link kudunga.");try{fl={id:await claude.files.put(f),name:f.name,type:f.type,size:f.size}}catch(e){return alert("File save aagala: "+(e.message||e))}}
 await put("notes",uid(),{title:t,subject:$("#ns").value,link:$("#nl").value,body:$("#nb").value,file:fl,at:Date.now()});render()}
function addC(){const t=$("#ct").value.trim(),w=$("#cd").value;if(!t||!w)return;put("classes",uid(),{topic:t,when:w,link:$("#cl").value.trim(),batch:$("#cb").value})}
nav();render();
(async()=>{
 try{
  const u=await claude.use("user");ce=u?await u.canEdit():false;
  db=await claude.use("db");try{role=localStorage.getItem("gr")||null;meId=localStorage.getItem("gm")||null;par=localStorage.getItem("gp")==="1"}catch(e){}if(role==="teacher"){if(ce)edit=true;else role=null}if(role==="student")tab="attendance";
  nav();
  if(db){sub("students",d=>S=d);sub("notes",d=>N=d);sub("classes",d=>C=d);sub("attendance",d=>A=d);sub("tests",d=>T=d);sub("fees",d=>F=d);sub("timetable",d=>TT=d);sub("homework",d=>HW=d);sub("mcq",d=>MQ=d);subSW();sub("notices",d=>NT=d);sub("settings",d=>CF=d.find(x=>x.id==="cfg")||{})}
  render();
 }catch(e){$("#who").textContent="Offline";render()}
})();
</script></body></html>
