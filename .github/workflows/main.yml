
name: GVRM Coaching Platform Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: gvrm-coaching-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Validate and Refresh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Coaching Platform
        run: npm run build

      - name: Refresh Completed
        run: echo "GVRM Coaching Platform validation completed."
