
name: GVRM Coaching Platform Refresh

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Coaching Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Website Files
        run: |
          test -f index.html
          test -f main.js
          test -f manifest.webmanifest
          echo "GVRM Coaching Platform files verified successfully."
